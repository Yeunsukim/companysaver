<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Screen Saver</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none; }
  .layer { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; opacity:0; transition:opacity .8s ease; }
  .layer.on { opacity:1; }
  img.layer, video.layer { object-fit:contain; }
  /* 콘텐츠(iframe)가 마우스를 가로채지 않도록 최상단 투명 덮개 - 입력 시 종료 감지용 */
  #shield { position:fixed; inset:0; z-index:10; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="shield"></div>
<script src="player.js"></script>
</body>
</html>
